<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Popcorn</title>
    <script src="js/theme-boot.js"></script>
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/library.css" />
    <link rel="stylesheet" href="css/screens.css" />
    <link rel="stylesheet" href="css/player.css" />
  </head>
  <body>
    <!-- Tauri only drags from the element carrying the attribute itself, so the
         controls inside stay clickable. -->
    <header id="topbar" class="header minimal" data-tauri-drag-region>
      <button type="button" class="brand" data-route="home" aria-label="Popcorn home">
        <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
          <path class="tub" d="M7 13h18l-2.4 15.5H9.4z" />
          <path class="stripe" d="M11.6 13l.8 15.5M16 13v15.5M20.4 13l-.8 15.5" />
          <g class="pop">
            <circle cx="10.2" cy="11" r="3.8" />
            <circle cx="16" cy="8.6" r="4.4" />
            <circle cx="21.8" cy="11" r="3.8" />
          </g>
        </svg>
        <span>Popcorn</span>
      </button>
      <nav class="nav" aria-label="Main" data-tauri-drag-region>
        <button type="button" class="tab" data-route="home">Home</button>
        <button type="button" class="tab" data-route="movies">Movies</button>
        <button type="button" class="tab" data-route="shows">TV Shows</button>
      </nav>
      <div class="header-end" data-tauri-drag-region>
        <div class="scan" id="scan" role="status" hidden>
          <span class="spinner"></span><span>Scanning library</span>
        </div>
        <label class="search" id="search-box">
          <input
            id="search"
            type="text"
            aria-label="Search your library"
            placeholder="Titles, cast, episodes"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
          />
          <kbd>⌘K</kbd>
        </label>
        <button type="button" class="icon-btn" id="theme-toggle"></button>
        <button type="button" class="icon-btn" data-route="settings" data-icon="settings" aria-label="Settings" title="Settings"></button>
      </div>
    </header>
    <main id="app" tabindex="-1"></main>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
