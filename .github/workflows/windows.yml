name: Windows Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      TAURI_CLI_VERSION: "2.12.6"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy --target x86_64-pc-windows-msvc
          rustup default stable

      - name: Cache slim libmpv
        id: cache-libmpv
        uses: actions/cache@v6
        with:
          path: build/windows
          key: libmpv-slim-windows-x64-${{ hashFiles('scripts/build-libmpv-windows.sh') }}

      - name: Setup MSYS2
        if: steps.cache-libmpv.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-libiconv
            curl

      - name: Build slim libmpv-2.dll
        if: steps.cache-libmpv.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: bash scripts/build-libmpv-windows.sh

      - name: Cache tauri-cli
        id: tauri-cli
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-tauri.exe
          key: tauri-cli-${{ runner.os }}-${{ runner.arch }}-${{ env.TAURI_CLI_VERSION }}

      - name: Install tauri-cli
        if: steps.tauri-cli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "=${{ env.TAURI_CLI_VERSION }}" --locked

      - name: Format, lint, test
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked

      - name: Build Windows installers
        run: cargo tauri build --config src-tauri/tauri.windows.conf.json

      - uses: actions/upload-artifact@v7
        with:
          name: Popcorn-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
